name: asdf

on:
  push:
    branches:
      - master
  pull_request:
  schedule:
    - cron: 0 0 * * 5
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin_test:
    name: asdf plugin test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          # Upstream builds the Linux binary against the Swift 5.10 runtime on
          # Ubuntu 22.04, so the test runs on the same image.
          - ubuntu-22.04
    runs-on: ${{ matrix.os }}
    steps:
      - name: Install Swift (Ubuntu only)
        if: runner.os == 'Linux'
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "5.10"
      - name: asdf_plugin_test
        # v4 is the first release that supports asdf >= 0.16 (the Go rewrite).
        uses: asdf-vm/actions/plugin-test@v4
        with:
          command: sourcery --version
