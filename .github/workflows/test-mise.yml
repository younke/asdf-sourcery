name: mise

on:
  push:
    branches:
      - master
  pull_request:
  schedule:
    - cron: 0 0 * * 5
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  test:
    name: mise test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          # Upstream builds the Linux binary against the Swift 5.10 runtime on
          # Ubuntu 22.04, so the test runs on the same image.
          - ubuntu-22.04
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Swift (Ubuntu only)
        if: runner.os == 'Linux'
        uses: swift-actions/setup-swift@v3
        with:
          swift-version: "5.10"

      - name: Mise
        uses: jdx/mise-action@v3
        with:
          install: false

      # Link the checkout so the workflow exercises this revision of the
      # plugin rather than whatever is on the default branch.
      - run: mise plugins link --force sourcery "$PWD"

      - run: mise exec sourcery@latest -- sourcery --version
